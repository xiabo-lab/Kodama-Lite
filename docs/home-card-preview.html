<!doctype html>
<html lang="en" class="dark" style="cursor: none">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Home card touch-target preview</title>
  </head>
  <body style="cursor: none">
    <!-- The iframe gives CSS an actual 1920x440 viewport, so `short:` is
         exercised even when this preview sits in an ordinary browser tab. -->
    <iframe
      title="1920 by 440 Home preview"
      src="./home-card-frame.html"
      width="1920"
      height="440"
      style="border: 0; display: block; transform: scale(0.45); transform-origin: 0 0"
    ></iframe>
  </body>
</html>
